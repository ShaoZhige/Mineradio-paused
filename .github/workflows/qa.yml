name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

jobs:
  gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:all

  lyrics-cdp:
    runs-on: windows-latest
    needs: gates
    env:
      MINERADIO_QA_PORT: 9442
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx install-electron
      - run: npm run qa:lyrics
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lyrics-qa-temp
          path: qa/.tmp
          if-no-files-found: ignore

  desktop-cdp:
    runs-on: windows-latest
    needs: gates
    env:
      MINERADIO_QA_DESKTOP_PORT: 9443
      MINERADIO_QA_ALLOW_SKIP: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx install-electron
      - run: npm run qa:desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-qa-temp
          path: qa/.tmp
          if-no-files-found: ignore
