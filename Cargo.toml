# Mineradio 的 Rust 工作区（Tauri 重写，见 docs/REWRITE-PLAN.md）
#
# 约束：业务 crate 一律不依赖 tauri，这样同一份代码能被 axum、cargo test、
# 以及过渡期的 napi 桥三处复用。
[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/mineradio-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-only"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "sync"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# 首次 cargo build 会把 tauri 全量编一遍，debug 也要几分种；发布版务必加 --release。
[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
