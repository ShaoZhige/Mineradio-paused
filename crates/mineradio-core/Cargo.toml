[package]
name = "mineradio-core"
version = "0.1.0"
edition = "2021"
publish = false

# 业务 crate 刻意**不依赖 tauri**：同一份逻辑要能被 axum、cargo test、以及
# rust-anything 的桥接层三处共用。加 tauri 进来就锁死在窗口进程里了。
[dependencies]
# TTML 的解析规则是照 `server/apple-music-lyrics.js` 的正则一字一句搬的，
# 用 regex 才能保持同样的懒惰匹配语义（手写扫描器会在 `<p>` 嵌套/属性引号上跑偏）。
regex = { workspace = true }
# 汽水音乐的加密音频是 aes-128-ctr；RustCrypto 的实现与 OpenSSL 逐字节一致（录制用例验证）。
aes = { workspace = true }
ctr = { workspace = true }
# QQ 会员探测的并发聚合（Promise.allSettled 的等价物）。
futures-util = { workspace = true }
# 会话缓存键的 sha256 —— 与 JS 的 crypto.createHash('sha256') 必须逐字节一致。
sha2 = { workspace = true }
# 登录请求体的 x-ss-stub。
md-5 = { workspace = true }
# 扫码地址与查询串的拼装（WHATWG URL 语义）。
url = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# resolve_qq_vip_from_probes 是 async，回放要在运行时里跑。
tokio = { workspace = true, features = ["macros", "rt"] }
serde_json = { workspace = true }
# 录制 fixture 里的二进制一律以 base64 存，测试侧解回来。
base64 = "0.22"
