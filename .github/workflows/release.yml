name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本 tag（如 v2.2.0），必须与 package.json 版本一致'
        required: true
      draft:
        description: '创建为草稿 Release（不立即公开）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mineradio-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  validate:
    name: 校验 tag 与版本号
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${RELEASE_TAG}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "Version validated: $VERSION"

  test:
    name: 回归测试与静态检查
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:ci
      - run: npm run check:quick

  build:
    name: 构建 Windows 安装包
    needs: [test]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - name: 构建安装包（不隐式发布）
        run: npm run build:win -- --publish never
      - name: 校验打包产物
        run: node scripts/verify-package.js
      - name: 生成 SHA-256 校验和
        shell: pwsh
        run: |
          $version = "${env:RELEASE_TAG}".TrimStart('v')
          $installer = Get-ChildItem "dist/Mineradio-$version-Setup.exe"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content "dist/Mineradio-$version-SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer
          path: |
            dist/Mineradio-*-Setup.exe
            dist/latest.yml
            dist/*.blockmap
            dist/Mineradio-*-SHA256SUMS.txt
          retention-days: 7

  publish:
    name: 创建 Release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: installer
          path: dist
      - name: 从 CHANGELOG 生成发布说明
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk -v section="## v$VERSION" '
            $0 == section { flag = 1; next }
            flag && /^## / { exit }
            flag { print }
          ' CHANGELOG.md > /tmp/changes.md
          if [ ! -s /tmp/changes.md ]; then
            echo "::error::CHANGELOG.md 缺少 v$VERSION 的章节"
            exit 1
          fi
          {
            echo "# Mineradio $VERSION"
            echo
            cat /tmp/changes.md
            echo
            echo "## 下载"
            echo
            echo "完整安装包：\`Mineradio-$VERSION-Setup.exe\`"
            echo
            echo "SHA-256 校验文件：\`Mineradio-$VERSION-SHA256SUMS.txt\`"
            echo
            echo '```'
            cat "dist/Mineradio-$VERSION-SHA256SUMS.txt"
            echo '```'
          } > release-notes.md
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@01570a1f39cb168c169c802c3bceb9e93fb10974 # v2.1.0
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Mineradio ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          files: |
            dist/Mineradio-*-Setup.exe
            dist/latest.yml
            dist/*.blockmap
            dist/Mineradio-*-SHA256SUMS.txt
