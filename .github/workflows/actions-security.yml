name: Actions Security

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/*.sh'
      - 'scripts/*.ps1'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/*.sh'
      - 'scripts/*.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # zizmor uploads its findings to Code Scanning as SARIF, which needs
    # security-events: write. The workflow-level permissions only grant
    # contents: read, so grant the extra scope at job level.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
        continue-on-error: true
      - name: Zizmor security scan
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
