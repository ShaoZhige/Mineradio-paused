name: CI
env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [22.x]
      fail-fast: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Node-level regression tests
        run: npm run test:ci

      - name: Quick check (static analysis)
        run: npm run check:quick

      # Tauri 重写期间的契约冻结：改 server.js / preload.js 必须同步更新
      # docs/API-CONTRACT.json，否则这里红。（重写完成后连同这两个脚本一起删）
      - name: API contract matches source
        run: npm run contract:check

      # public/ 在重写期间必须逐字节不动；有意改动要重跑 npm run hash:public 并在提交里说明。
      - name: public/ matches baseline hashes
        run: npm run hash:check

      # shim 是从契约生成的，契约一变就必须重新生成（130 个桥项手写必漏）。
      - name: desktopWindow shim matches contract
        run: npm run shim:check

      # Rust 侧的 Cookie 头归一化是对着 fixture 回放的。JS 那边改了逻辑却不重录，
      # 回放照样绿（它只证明"Rust 与旧 JS 一致"），所以这里必须比一遍。
      - name: Cookie header fixture matches JS behaviour
        run: npm run cookie:check

  required-gate:
    if: always()
    needs: [test-node]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - run: |
          if [ "${{ needs.test-node.result }}" != "success" ]; then
            echo "::error::Required check failed: ${{ needs.test-node.result }}"
            exit 1
          fi
          echo "All required checks passed"
