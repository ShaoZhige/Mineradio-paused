name: Actions Security

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/*.sh'
      - 'scripts/*.ps1'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/*.sh'
      - 'scripts/*.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # zizmor uploads its findings to Code Scanning as SARIF, which needs
    # security-events: write. The workflow-level permissions only grant
    # contents: read, so grant the extra scope at job level.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # actionlint 保持 advisory（continue-on-error）是**刻意的**，不是忘了摘：
      # 它除了校验 YAML 结构，还会对 `run:` 块跑 shellcheck，而本机没有可复现的运行方式
      # （无 docker、无 actionlint 二进制），因此无法证明"摘掉之后它一定绿"。
      # 按本仓库的惯例，**证明不了能红的检查就不当门禁**，只标注为参考。
      # 真正提供安全信号的是下面的 zizmor 步骤（结果以 SARIF 进 Security 标签页）。
      # actionlint stays advisory ON PURPOSE, not by neglect: besides YAML structure it shellchecks
      # every `run:` block, and there is no reproducible way to run it here (no docker, no actionlint
      # binary), so "it would pass if we removed continue-on-error" cannot be proven. This repo's rule
      # is that a check which cannot be proven able to fail does not get to gate. The real security
      # signal comes from the zizmor step below, whose findings land in the Security tab via SARIF.
      - name: Run actionlint (advisory)
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
        continue-on-error: true
      - name: Zizmor security scan
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
