name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本 tag（如 v2.2.0），必须与 package.json 版本一致'
        required: true
      draft:
        description: '创建为草稿 Release（不立即公开）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mineradio-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  validate:
    name: 校验 tag 与版本号
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${RELEASE_TAG}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "Version validated: $VERSION"

  test:
    name: 回归测试与静态检查
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:ci
      - run: npm run check:quick

  build:
    name: 构建 Windows 安装包
    needs: [test]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - name: 构建安装包（不隐式发布）
        run: npm run build:win -- --publish never
      - name: 校验打包产物
        run: node scripts/verify-package.js
      - name: 用仓库内的极简版本说明覆盖打包工具生成的更新清单
        # electron-builder 会在 dist/ 生成带 files[].url / sha512 / path 的 latest.yml，那是
        # electron-updater 的自动更新源；再配上 .blockmap，任何 electron-builder 生态的客户端
        # 或第三方工具都能据此静默下载并安装，绕过「只提示、用户自行到网盘下载」的设计。
        # 用版本控制内的极简文件覆盖掉它（只含 version/releaseDate），并因此不再随附 blockmap。
        # electron-builder emits a dist/latest.yml carrying files[].url / sha512 / path — an
        # electron-updater feed. Together with the .blockmap it would let any electron-builder-based
        # client download and install silently. Overwrite it with the minimal, version-controlled
        # manifest (version/releaseDate only) and drop the blockmap for the same reason.
        shell: pwsh
        run: Copy-Item docs/update/latest.yml dist/latest.yml -Force
      - name: 生成 SHA-256 校验和
        shell: pwsh
        run: |
          $version = "${env:RELEASE_TAG}".TrimStart('v')
          $installer = Get-ChildItem "dist/Mineradio-$version-Setup.exe"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content "dist/Mineradio-$version-SHA256SUMS.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: |
            dist/Mineradio-*-Setup.exe
            dist/latest.yml
            dist/Mineradio-*-SHA256SUMS.txt
          retention-days: 7
      - name: 在运行摘要里列出产物
        # runner 跑完就销毁，产物只能靠 Release 附件带走。摘要里列出这一版的成品，方便回头
        # 核对云端这份与本地那份是不是同一条提交打出来的。
        # The runner is gone afterwards; list what this run produced where it will be seen.
        shell: pwsh
        run: |
          $version = "${env:RELEASE_TAG}".TrimStart('v')
          $installer = Get-ChildItem "dist/Mineradio-$version-Setup.exe"
          $sizeMb = [math]::Round($installer.Length / 1MB, 1)
          $lines = @(
            '### 构建产物',
            '',
            "- $($installer.Name) — $sizeMb MB",
            '- latest.yml',
            "- Mineradio-$version-SHA256SUMS.txt",
            '',
            '本地那份由 3-build.bat 打出，归档在仓库上一级的 releases\<tag>\ 里。'
          )
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  publish:
    name: 创建 Release
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: dist
      - name: 从 CHANGELOG 生成发布说明
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk -v section="## v$VERSION" '
            $0 == section { flag = 1; next }
            flag && /^## / { exit }
            flag { print }
          ' CHANGELOG.md > /tmp/changes.md
          if [ ! -s /tmp/changes.md ]; then
            echo "::error::CHANGELOG.md 缺少 v$VERSION 的章节"
            exit 1
          fi
          {
            echo "# Mineradio $VERSION"
            echo
            cat /tmp/changes.md
            echo
            echo "## 下载"
            echo
            echo "国内用户推荐从阿里云盘下载（不限速）：https://www.alipan.com/s/36YiXCzvuKt"
            echo
            echo "备用蓝奏云：https://wwars.lanzouq.com/b014xlh7gb 密码 9izq"
            echo
            echo "完整安装包：\`Mineradio-$VERSION-Setup.exe\`"
            echo
            echo "SHA-256 校验文件：\`Mineradio-$VERSION-SHA256SUMS.txt\`"
            echo
            echo '```'
            cat "dist/Mineradio-$VERSION-SHA256SUMS.txt"
            echo '```'
            echo
            # ⚠️ 这两行必须保留：客户端从正文里解析 `mineradio-download-page` 标记，
            # 用它构造「网盘下载」入口。清理发布说明时删掉它，软件内的更新入口就会悄悄
            # 退回成「打开 Release 页面」，不会报错、也没有日志。
            # ⚠️ The marker below must survive any edit of the release notes: the client parses
            # `mineradio-download-page` from the body to build its mirror-download entry.
            echo '<!-- mineradio-download-page: 阿里云盘|https://www.alipan.com/s/36YiXCzvuKt -->'
            echo '<!-- mineradio-download-page: 蓝奏云|https://wwars.lanzouq.com/b014xlh7gb -->'
          } > release-notes.md
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Mineradio ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          files: |
            dist/Mineradio-*-Setup.exe
            dist/latest.yml
            dist/Mineradio-*-SHA256SUMS.txt
