# Mineradio 的 Rust 工作区（Tauri 重写，见 docs/REWRITE-PLAN.md）
#
# 约束：业务 crate 一律不依赖 tauri，这样同一份代码能被 axum、cargo test、
# 以及过渡期的 napi 桥三处复用。
[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/mineradio-core",
    "crates/mineradio-http",
    "crates/mineradio-log",
    "crates/mineradio-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-only"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "sync", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
regex = "1"
aes = "0.8"
ctr = "0.9"
# HTTP 客户端。feature 组合是刻意挑的，见 crates/mineradio-http/src/client.rs 头部：
#   native-tls-no-alpn → 走 Windows schannel（信任系统证书库，与 Node 的
#                        applySystemCertificateAuthorities 意图一致），且不发 ALPN
#   default-features = false → 关掉 http2 / charset / system-proxy / gzip
#   stream → 只为了 Body::wrap_stream，让请求体走 chunked（Node 的 req.write 就是 chunked）
reqwest = { version = "0.13", default-features = false, features = ["native-tls-no-alpn", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# QQ 会员的会话缓存键要 sha256，与 JS 的 crypto.createHash('sha256') 必须逐字节一致。
sha2 = "0.10"

# 首次 cargo build 会把 tauri 全量编一遍，debug 也要几分种；发布版务必加 --release。
[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
