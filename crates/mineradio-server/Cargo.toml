[package]
name = "mineradio-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Mineradio 的本地 HTTP 服务：静态托管 public/ + /api + /internal（不依赖 tauri）"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
# 静态资源语义（MIME 表 / 弱 ETag / If-None-Match）搬在 core 里，server 只负责拼 HTTP。
mineradio-core = { path = "../mineradio-core" }
# 日志格式与脱敏规则由 mineradio-log 统一，server 只挑事件名。
mineradio-log = { path = "../mineradio-log" }

[[bin]]
name = "mineradio-server"
path = "src/main.rs"
