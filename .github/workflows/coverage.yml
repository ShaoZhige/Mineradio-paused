name: Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      # 覆盖率在这里是**报告**，不是门禁：这条步骤的产物是上传的 coverage-report 工件，
      # 没有覆盖率门槛（仓库里也没有覆盖率阈值配置）。步骤名写明 report only，
      # 免得有人看到 "Coverage ✓" 以为存在一条覆盖率红线。
      # Coverage here is a REPORT, not a gate: the step's product is the uploaded coverage-report
      # artifact and there is no threshold configured anywhere. The step name says so, so a green
      # "Coverage" is not mistaken for a coverage floor being enforced.
      - name: Run tests with coverage (report only)
        run: node --experimental-test-coverage scripts/run-ci-tests.js
        continue-on-error: true
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7
